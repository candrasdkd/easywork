services:
  - type: web
    name: easywork-certificate-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./scripts/Dockerfile.certificate-api
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: EASYWORK_CERTIFICATE_API_HOST
        value: 0.0.0.0
      - key: EASYWORK_ALLOWED_ORIGINS
        value: https://easywork.vercel.app
      - key: EASYWORK_REQUIRE_AUTH
        value: "true"
      - key: FIREBASE_PROJECT_ID
        value: easywork-483f9
